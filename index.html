const TRAINING_START = new Date("2026-07-21");
const RACE_DATE = new Date("2026-11-26");

function generateScheduledDays() {
  const days = [];
  const cursor = new Date(TRAINING_START);
  while (cursor <= RACE_DATE) {
    if (cursor.getDay() !== 0) days.push(cursor.toISOString().split("T")[0]);
    cursor.setDate(cursor.getDate() + 1);
  }
  return days;
}
const ALL_SCHEDULED_DAYS = generateScheduledDays();

function getWeekKey(dateStr) {
  const d = new Date(dateStr);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  return new Date(new Date(dateStr).setDate(diff)).toISOString().split("T")[0];
}
function getMonthKey(s) { return s.slice(0, 7); }
function toDateStr(d) { return d.toISOString().split("T")[0]; }
function today() { return toDateStr(new Date()); }

const STORAGE_KEY = "mrr-workout-log-v1";
function loadLog() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch { return {}; } }
function persistLog(lg) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(lg)); } catch {} }

function computeStats(log) {
  const todayStr = today();
  const past = ALL_SCHEDULED_DAYS.filter(d => d <= todayStr);
  const counts = { rx:0, modified:0, skipped:0, unlogged:0 };
  past.forEach(d => {
    const s = log[d];
    if (!s) counts.unlogged++;
    else if (s.status==="rx") counts.rx++;
    else if (s.status==="modified") counts.modified++;
    else if (s.status==="skipped") counts.skipped++;
  });
  const completed = counts.rx + counts.modified;
  const total = past.length;
  const weekStart = getWeekKey(todayStr);
  const weekDays = past.filter(d => getWeekKey(d) === weekStart);
  const weekCompleted = weekDays.filter(d => log[d] && (log[d].status==="rx"||log[d].status==="modified")).length;
  const monthKey = getMonthKey(todayStr);
  const monthDays = past.filter(d => getMonthKey(d) === monthKey);
  const monthCompleted = monthDays.filter(d => log[d] && (log[d].status==="rx"||log[d].status==="modified")).length;
  let streak = 0;
  for (const d of [...past].reverse()) {
    const s = log[d];
    if (s && (s.status==="rx"||s.status==="modified")) streak++;
    else if (!s && d===todayStr) continue;
    else break;
  }
  const daysToRace = Math.ceil((RACE_DATE - new Date()) / 86400000);
  return { completed, total, counts, weekCompleted, weekTotal:weekDays.length, monthCompleted, monthTotal:monthDays.length, streak, daysToRace };
}

function getCurrentWorkout() {
  const dow = new Date().getDay();
  if (dow===0) return null;
  const pr = [
    { phase:phases[0], start:new Date("2026-07-21"), end:new Date("2026-08-10") },
    { phase:phases[1], start:new Date("2026-08-11"), end:new Date("2026-09-07") },
    { phase:phases[2], start:new Date("2026-09-08"), end:new Date("2026-10-12") },
    { phase:phases[3], start:new Date("2026-10-13"), end:new Date("2026-11-21") },
  ];
  const now = new Date();
  const cur = pr.find(r => now>=r.start && now<=r.end);
  if (!cur) return null;
  const names = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const w = cur.phase.days.find(d => d.day===names[dow]);
  return w ? { ...w, phaseName:cur.phase.name, phaseColor:cur.phase.color } : null;
}

  const recentDays = ALL_SCHEDULED_DAYS.filter(d => d<=todayStr).slice(-36);
  const getMot = () => {
    if (stats.streak>=10) return { msg:"Unstoppable. Double-digit streak.", color:"#4ade80" };
    if (stats.streak>=5)  return { msg:stats.streak+"-session streak. Momentum is building.", color:"#4ade80" };
    if (stats.streak>=2)  return { msg:stats.streak+" in a row. Keep the chain going.", color:"#86efac" };
    if (stats.completed>=20) return { msg:stats.completed+" sessions banked. That\u2019s real fitness.", color:"#facc15" };
    if (stats.completed>=5)  return { msg:stats.completed+" sessions in. The habit is forming.", color:"#facc15" };
    return { msg:"Every session counts. One at a time.", color:"#888" };
  };
  const mot = getMot();
  const [selDate, setSelDate] = useState(today());
  const ex2 = log[selDate];
  return (
    <section style={{ marginBottom:48 }}>
      <h2 style={S.h2}><span style={{ color:"#4ade80" }}>08</span> Progress & History</h2>
      <div style={{ ...S.card, borderColor:mot.color+"44", background:mot.color+"0a", marginBottom:20, textAlign:"center", padding:"18px 20px" }}>
        <div style={{ fontSize:16, fontWeight:700, color:mot.color, fontFamily:"'Barlow Condensed',sans-serif", letterSpacing:"0.04em" }}>{mot.msg}</div>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:10, marginBottom:20 }}>
        <StatBox label="SESSIONS DONE" value={stats.completed} sub="Rx + Modified" color="#4ade80" big />
        <StatBox label="STREAK" value={stats.streak} sub="consecutive" color="#facc15" />
        <StatBox label="DAYS TO RACE" value={stats.daysToRace>0?stats.daysToRace:"\ud83c\udfc1"} sub="Nov 26, 2026" color="#f97316" />
        <StatBox label="Rx SESSIONS" value={stats.counts.rx} sub="as programmed" color="#86efac" />
      </div>
      <div style={{ ...S.card, marginBottom:20 }}>
        <div style={{ fontSize:12, color:"#888", fontFamily:"'DM Mono',monospace", marginBottom:16 }}>CONSISTENCY</div>
        <Bar completed={stats.weekCompleted} total={stats.weekTotal} color="#4ade80" label="This Week" />
        <Bar completed={stats.monthCompleted} total={stats.monthTotal} color="#facc15" label="This Month" />
        <Bar completed={stats.completed} total={stats.total} color="#f97316" label="Since Day 1" />
        <div style={{ marginTop:16, padding:"10px 14px", background:"#161616", borderRadius:8 }}>
          <div style={{ fontSize:12, color:"#666", fontFamily:"'DM Mono',monospace" }}>Modified workouts count as completions. Showing up matters most.</div>
        </div>
      </div>
      <div style={{ ...S.card, marginBottom:20 }}>
        <div style={{ fontSize:12, color:"#888", fontFamily:"'DM Mono',monospace", marginBottom:14 }}>RECENT SESSIONS</div>
        {recentDays.length===0 ? <div style={{ fontSize:13, color:"#555" }}>Training starts July 21, 2026.</div> : (
          <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
            {recentDays.map(d => {
              const entry=log[d], isToday=d===todayStr, cfg=entry?SC[entry.status]:null;
              const obj=new Date(d+"T12:00:00"), dl=obj.toLocaleDateString("en-US",{weekday:"short"}), dtl=obj.toLocaleDateString("en-US",{month:"numeric",day:"numeric"});
              return (
                <div key={d} title={dtl+" \u2014 "+(entry?cfg.label:"Not logged")}
                  style={{ width:44, height:44, borderRadius:8, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
                    background:cfg?cfg.color+"18":"#161616", border:"1px solid "+(isToday?"#fff":cfg?cfg.color+"55":"#222"),
                    boxShadow:isToday?"0 0 0 2px #ffffff33":"none" }}>
                  <div style={{ fontSize:9, color:cfg?cfg.color:"#444", fontFamily:"'DM Mono',monospace" }}>{dl}</div>
                  <div style={{ fontSize:13, color:cfg?cfg.color:"#333", fontWeight:700 }}>{cfg?cfg.symbol:"\u00b7"}</div>
                </div>
              );
            })}
          </div>
        )}
      </div>
      <div style={{ ...S.card, borderColor:"#2a2a2a" }}>
        <div style={{ fontSize:12, color:"#888", fontFamily:"'DM Mono',monospace", marginBottom:14 }}>LOG A SESSION</div>
        <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:14 }}>
          <input type="date" value={selDate} onChange={e=>setSelDate(e.target.value)}
            style={{ background:"#161616", border:"1px solid #333", borderRadius:6, padding:"6px 10px", color:"#e0e0e0", fontFamily:"'DM Mono',monospace", fontSize:13 }} />
          {ex2 && <Tag color={SC[ex2.status].color}>{SC[ex2.status].label}</Tag>}
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8 }}>
          {Object.entries(SC).map(([key, cfg]) => {
            const sel=ex2?.status===key;
            return (
              <button key={key} onClick={() => onLog(selDate, key)}
                style={{ background:sel?cfg.color+"22":"transparent", border:"1px solid "+(sel?cfg.color+"66":"#2a2a2a"), borderRadius:8, padding:"10px 8px", cursor:"pointer", textAlign:"center" }}>
                <div style={{ fontSize:16, color:sel?cfg.color:"#555" }}>{cfg.symbol}</div>
                <div style={{ fontSize:12, fontWeight:700, color:sel?cfg.color:"#555", fontFamily:"'Barlow Condensed',sans-serif" }}>{cfg.label}</div>
              </button>
            );
          })}
        </div>
      </div>
    </section>
  );
}

const TABS = [
  { id:"today",label:"Today" },
  { id:"history",label:"Progress" },
  { id:"plan",label:"Plan" },
  { id:"row",label:"Row Targets" },
  { id:"feasibility",label:"Feasibility" },
  { id:"daily",label:"Schedule" },
  { id:"injury",label:"Injury" },
  { id:"gear",label:"Gear" },
];

function App() {
  const [tab, setTab] = useState("today");
  const [log, setLog] = useState(() => loadLog());

  const handleLog = (dateStr, status) => {
    const existing = log[dateStr];
    const newEntry = existing?.status===status ? undefined : { status, loggedAt:new Date().toISOString() };
    const newLog = { ...log };
    if (newEntry) newLog[dateStr]=newEntry; else delete newLog[dateStr];
    setLog(newLog);
    persistLog(newLog);
  };

  return (
    <div style={{ background:"#0a0a0a", minHeight:"100vh", color:"#e0e0e0", fontFamily:"'Inter',sans-serif", maxWidth:900, margin:"0 auto", padding:"0 0 80px" }}>
      <div style={{ padding:"28px 28px 20px", borderBottom:"1px solid #1e1e1e", marginBottom:28 }}>
        <div style={{ fontSize:11, color:"#4ade80", fontFamily:"'DM Mono',monospace", letterSpacing:"0.15em", marginBottom:6 }}>MANCHESTER ROAD RACE \u2014 THANKSGIVING 2026</div>
        <h1 style={{ fontFamily:"'Barlow Condensed',sans-serif", fontSize:38, fontWeight:800, color:"#ffffff", lineHeight:1, letterSpacing:"0.01em", marginBottom:4 }}>SUB-30 TRAINING PLAN</h1>
        <div style={{ fontSize:13, color:"#666", marginBottom:16 }}>4.737 miles \u00b7 Nov 26, 2026 \u00b7 July 21 start \u00b7 18 Weeks</div>
        <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>
          {TABS.map(t => (
            <button key={t.id} onClick={()=>setTab(t.id)}
              style={{ background:tab===t.id?"#4ade80":"transparent", color:tab===t.id?"#0a0a0a":"#666",
                border:"1px solid "+(tab===t.id?"#4ade80":"#2a2a2a"), borderRadius:6, padding:"5px 12px",
                fontSize:11, fontWeight:700, fontFamily:"'DM Mono',monospace", letterSpacing:"0.05em",
                cursor:"pointer", transition:"all 0.15s" }}>
              {t.label.toUpperCase()}
            </button>
          ))}
        </div>
      </div>
      <div style={{ padding:"0 28px" }}>
        {tab==="today"       && <TodaySection log={log} onLog={handleLog} />}
        {tab==="history"     && <HistorySection log={log} onLog={handleLog} />}
        {tab==="plan"        && <TrainingPlanSection />}
        {tab==="row"         && <RowTargetsSection />}
        {tab==="feasibility" && <FeasibilitySection />}
        {tab==="daily"       && <DailyStructureSection />}
        {tab==="injury"      && <InjurySection />}
        {tab==="gear"        && <GearSection />}
      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
